services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trustlayer-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trustlayer-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
